[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "i-attp"
version = "0.1.2"
description = "S-ATTP: cluster-stratified train/test splitting on an LDA-reduced feature space."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jabulani Monchwe", email ="MonchweJ.25@gmail.com" }]
keywords = ["machine-learning", "train-test-split", "stratification", "lda", "kmeans"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Jabualani/ATTP"
Repository = "https://github.com/Jabualani/ATTP"
Issues = "https://github.com/Jabualani/ATTP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/attp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]